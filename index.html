<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castle Phonk</title>
  <meta name="description"
    content="Castle Phonk — A gesture-controlled phonk music visualizer. Move your hand to control the music.">
  <!-- Run with: python -m http.server 8080 or VS Code Live Server -->
  <!-- Do NOT open via file:// — audio CORS requires same-origin serving -->

  <!-- Google Fonts: Cinzel for gothic elegance -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================
       STEP 2 — CSS (from uiux.md)
       ============================================ */

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0A0A14;
      font-family: 'Cinzel', serif;
      cursor: default;
      user-select: none;
    }

    /* --- Castle Background --- */
    #castle-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center bottom;
      z-index: 0;
      filter: brightness(0.75) contrast(1.1) saturate(0.9);
    }

    /* --- Fog Layer --- */
    #fog-layer {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 30%;
      background: linear-gradient(to top, rgba(180, 200, 220, 0.12), transparent);
      animation: fogDrift 8s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes fogDrift {
      from {
        opacity: 0.6;
        transform: translateX(-1%);
      }

      to {
        opacity: 1.0;
        transform: translateX(1%);
      }
    }

    /* --- Sky Overlay (star twinkle) --- */
    #sky-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.06;
      animation: starTwinkle 4s ease-in-out infinite alternate;
    }

    @keyframes starTwinkle {
      from {
        opacity: 0.03;
      }

      to {
        opacity: 0.08;
      }
    }

    /* --- Moon Overlay --- */
    #moon-overlay {
      position: absolute;
      top: 6%;
      right: 18%;
      width: 8%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 220, 0.15) 0%, transparent 70%);
      mix-blend-mode: screen;
      transition: filter 0.1s ease;
      pointer-events: none;
      z-index: 2;
    }

    /* --- City Overlay (Spider-Man Mode) --- */
    #city-overlay {
      position: fixed;
      inset: 0;
      background-image: url('spiderman-city.png');
      background-size: cover;
      background-position: center;
      opacity: 0;
      mix-blend-mode: overlay;
      transition: opacity 2s ease;
      z-index: 1;
      pointer-events: none;
    }

    #city-overlay.active {
      opacity: 0.55;
    }

    /* --- Castle Window Glow --- */
    .castle-window {
      position: absolute;
      border-radius: 50%;
      background: transparent;
      opacity: 0;
      mix-blend-mode: color-dodge;
      filter: blur(8px);
      pointer-events: none;
      z-index: 2;
      transform: translate(-50%, -50%);
      will-change: opacity, transform, filter;
    }

    .castle-window.lit {
      background: radial-gradient(circle at center,
          rgba(255, 255, 255, 0.8) 0%,
          var(--window-color) 40%,
          transparent 70%);
      box-shadow: 0 0 15px 5px var(--window-color),
        0 0 40px 20px color-mix(in srgb, var(--window-color) 30%, transparent);
    }

    #webcam-preview {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 180px;
      height: 135px;
      border-radius: 12px;
      opacity: 0.6;
      border: 1px solid rgba(255, 255, 255, 0.15);
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 30;
      transition: opacity 0.3s;
      background: #000;
    }

    #webcam-preview:hover {
      opacity: 0.9;
    }

    /* --- Webcam Canvas for Skeleton --- */
    #webcam-canvas {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 180px;
      height: 135px;
      border-radius: 12px;
      z-index: 31;
      pointer-events: none;
      transform: scaleX(-1);
      /* mirror */
    }

    /* --- Track Name --- */
    #track-name {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 0.25em;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 20;
      pointer-events: none;
    }

    #track-name.visible {
      opacity: 1;
    }

    /* --- Overlay Canvas --- */
    #overlay-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    /* --- Hidden Video for MediaPipe --- */
    #input-video {
      display: none;
    }

    /* --- Start Screen --- */
    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 20, 0.7);
      cursor: pointer;
      transition: opacity 1s ease;
    }

    #start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #start-screen h1 {
      font-family: 'Cinzel', serif;
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.15em;
      margin-bottom: 24px;
      text-shadow: 0 0 40px rgba(124, 58, 237, 0.5), 0 0 80px rgba(124, 58, 237, 0.2);
    }

    #start-screen p {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    #start-screen .click-hint {
      margin-top: 48px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.3em;
      animation: pulseFade 2s ease-in-out infinite;
    }

    @keyframes pulseFade {

      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 0.7;
      }
    }

    
    /* --- Songs HUD --- */
    #songs-hud {
      position: fixed;
      top: 24px;
      left: 24px;
      width: 290px;
      background: rgba(10, 10, 20, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 14px;
      z-index: 25;
      color: #fff;
      font-family: 'Cinzel', serif;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s ease;
    }

    #songs-hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.9);
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 8px;
    }

    #songs-count-badge {
      font-size: 9px;
      background: rgba(139, 92, 246, 0.25);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.1em;
    }

    #songs-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 240px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 0.1em;
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      color: rgba(255, 255, 255, 0.65);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .song-item:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #fff;
    }

    .song-item.active {
      background: rgba(139, 92, 246, 0.3);
      border: 1px solid rgba(139, 92, 246, 0.5);
      color: #fff;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.35);
    }

    .song-item .song-title {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .song-item .song-tag {
      font-size: 8px;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
    }

    .song-item.active .song-tag {
      color: #c4b5fd;
    }

    #start-btn {
      margin-top: 18px;
      padding: 16px 36px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.5), rgba(239, 68, 68, 0.5));
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      color: #fff;
      font-family: 'Cinzel', serif;
      font-size: 14px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 30px rgba(124, 58, 237, 0.4);
    }

    #start-btn:hover {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.8), rgba(239, 68, 68, 0.8));
      box-shadow: 0 0 50px rgba(124, 58, 237, 0.7);
      transform: scale(1.05);
    }

    /* --- Error Screen --- */
    #error-screen {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 20, 0.9);
    }

    #error-screen.active {
      display: flex;
    }

    #error-screen p {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
      max-width: 500px;
      line-height: 2;
    }
  </style>
</head>

<body>

  <!-- ============================================
       STEP 1 — HTML Structure
       ============================================ -->

  <!-- Castle Background -->
  <img id="castle-bg" src="castle.png" alt="Gothic Castle">

  <!-- Atmosphere Layers -->
  <div id="fog-layer"></div>
  <div id="sky-overlay"></div>
  <div id="moon-overlay"></div>

  <!-- City Overlay (Spider-Man Mode) -->
  <div id="city-overlay"></div>

  <!-- Castle Windows Container -->
  <div id="windows-container">
    <!-- 18 windows will be created by JS -->
  </div>

  <!-- Overlay Canvas (volume arc, web effects) -->
  <canvas id="overlay-canvas"></canvas>

  <!-- Webcam Preview -->
  <video id="webcam-preview" autoplay playsinline muted></video>
  <canvas id="webcam-canvas"></canvas>

  <!-- Track Name Display -->
  <div id="track-name"></div>

  <!-- Songs HUD / Active Playlist -->
  <div id="songs-hud">
    <div id="songs-hud-header">
      <span>⚔️ CASTLE TRACKS</span>
      <span id="songs-count-badge">10 TRACKS</span>
    </div>
    <div id="songs-list">
      <!-- Populated dynamically -->
    </div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen">
    <h1>CASTLE PHONK</h1>
    <p class="subtitle" style="font-size: 15px; color: rgba(255,255,255,0.7); letter-spacing: 0.25em; text-transform: uppercase; margin-bottom: 12px;">Gothic Gestural Visualizer</p>
    <button id="start-btn">ENTER THE CASTLE</button>
    <p class="click-hint" style="margin-top: 16px;">[ Click anywhere to enable camera & audio ]</p>
  </div>

  <!-- Error Screen -->
  <div id="error-screen">
    <p id="error-message"></p>
  </div>

  <!-- ============================================
       CDN Dependencies
       ============================================ -->
  <!-- Local Offline-Ready Dependencies -->
  <script src="hands.js"></script>
  <script src="camera_utils.js"></script>
  <script src="Tone.js"></script>

  <script>
    // ============================================
    // Castle Phonk — Main Application
    // ============================================

    // --- DOM References ---
    const castleBg = document.getElementById('castle-bg');
    const fogLayer = document.getElementById('fog-layer');
    const moonOverlay = document.getElementById('moon-overlay');
    const cityOverlay = document.getElementById('city-overlay');
    const overlayCanvas = document.getElementById('overlay-canvas');
    const ctx = overlayCanvas.getContext('2d');
    const webcamPreview = document.getElementById('webcam-preview');
    const webcamCanvas = document.getElementById('webcam-canvas');
    const wCtx = webcamCanvas.getContext('2d');
    const trackNameEl = document.getElementById('track-name');
    const startScreen = document.getElementById('start-screen');
    const errorScreen = document.getElementById('error-screen');
    const errorMessage = document.getElementById('error-message');

    // --- Canvas Sizing ---
    function resizeCanvas() {
      overlayCanvas.width = window.innerWidth;
      overlayCanvas.height = window.innerHeight;

      webcamCanvas.width = 180;
      webcamCanvas.height = 135;

      resizeWindowsContainer();
    }

    function resizeWindowsContainer() {
      if (!castleBg.complete) return;
      const imgW = castleBg.naturalWidth;
      const imgH = castleBg.naturalHeight;
      if (!imgW || !imgH) return;

      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const imgRatio = imgW / imgH;
      const winRatio = winW / winH;

      let finalW, finalH, finalX, finalY;
      if (winRatio > imgRatio) {
        finalW = winW;
        finalH = winW / imgRatio;
        finalX = 0;
        finalY = winH - finalH;
      } else {
        finalH = winH;
        finalW = winH * imgRatio;
        finalX = (winW - finalW) / 2;
        finalY = winH - finalH;
      }

      const wc = document.getElementById('windows-container');
      wc.style.position = 'fixed';
      wc.style.left = finalX + 'px';
      wc.style.top = finalY + 'px';
      wc.style.width = finalW + 'px';
      wc.style.height = finalH + 'px';
      wc.style.pointerEvents = 'none';
      wc.style.zIndex = '5';
    }

    castleBg.addEventListener('load', resizeWindowsContainer);
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- Star field generation for sky overlay ---
    (function generateStars() {
      const skyOverlay = document.getElementById('sky-overlay');
      const starCanvas = document.createElement('canvas');
      starCanvas.width = 800;
      starCanvas.height = 400;
      const sctx = starCanvas.getContext('2d');
      for (let i = 0; i < 120; i++) {
        const x = Math.random() * 800;
        const y = Math.random() * 400;
        const r = Math.random() * 1.5 + 0.3;
        const a = Math.random() * 0.6 + 0.2;
        sctx.beginPath();
        sctx.arc(x, y, r, 0, Math.PI * 2);
        sctx.fillStyle = `rgba(255,255,240,${a})`;
        sctx.fill();
      }
      skyOverlay.style.backgroundImage = `url(${starCanvas.toDataURL()})`;
      skyOverlay.style.backgroundRepeat = 'repeat';
    })();


    // ============================================
    // STEP 3 — Audio System
    // ============================================

    // Track energy profiles (from TRD.md)
    const trackProfiles = [
      { id: 1, filename: 'track01.mp3', name: 'Track 01 — Dark Ambience', mood: 'Slow Dark', tempo: 0.2, aggression: 0.3, darkness: 0.8, chaos: 0.2 },
      { id: 2, filename: 'track02.mp3', name: 'Track 02 — Montagem Supersonic', mood: 'Hard Phonk', tempo: 0.9, aggression: 0.9, darkness: 0.7, chaos: 0.8 },
      { id: 3, filename: 'track03.mp3', name: 'Track 03 — Montagem Bravo', mood: 'Aggressive', tempo: 0.5, aggression: 0.5, darkness: 0.6, chaos: 0.4 },
      { id: 4, filename: 'track04.mp3', name: 'Track 04 — Midnight Slump', mood: 'Deep Slow', tempo: 0.1, aggression: 0.2, darkness: 0.9, chaos: 0.1 },
      { id: 5, filename: 'track05.mp3', name: 'Track 05 — Hypnotic Phonk', mood: 'Hypnotic', tempo: 0.7, aggression: 0.6, darkness: 0.5, chaos: 0.6 },
      { id: 6, filename: 'track06.mp3', name: 'Track 06 — Cala Boca', mood: 'Brazilian', tempo: 0.4, aggression: 0.7, darkness: 0.8, chaos: 0.5 },
      { id: 7, filename: 'track07.mp3', name: 'Track 07 — Neon Velocity', mood: 'Fast Beat', tempo: 0.8, aggression: 0.8, darkness: 0.4, chaos: 0.7 },
      { id: 8, filename: 'track08.mp3', name: 'Track 08 — Shadow Realm', mood: 'Gothic Pace', tempo: 0.3, aggression: 0.4, darkness: 0.7, chaos: 0.3 },
      { id: 9, filename: 'track09.mp3', name: 'Track 09 — Cyber Mayhem', mood: 'Chaotic', tempo: 0.6, aggression: 0.5, darkness: 0.6, chaos: 0.9 },
      { id: 10, filename: 'track10.mp3', name: 'Track 10 — Gothic Drop', mood: 'Bass Heavy', tempo: 0.5, aggression: 0.6, darkness: 0.9, chaos: 0.5 },
    ];

    // Audio state
    let players = {};
    let spiderPlayer = null;
    let masterVol = null;
    let analyser = null;
    let dataArray = null;
    let currentTrackId = null;
    let masterVolume = 0.6; // 0–1
    let audioReady = false;
    let isPlaying = false;
    let isCrossfading = false;

    async function initAudio() {
      if (typeof Tone === 'undefined') {
        throw new Error('Tone.js library failed to load — check connection');
      }
      await Tone.start();

      Tone.Destination.volume.value = 0;
      masterVol = new Tone.Volume(volumeToDb(masterVolume)).toDestination();

      // Load all track players
      trackProfiles.forEach(track => {
        const player = new Tone.Player({
          url: `audio/${track.filename}`,
          loop: true,
          volume: -60, // start silent
        }).connect(masterVol);
        players[track.id] = player;
      });

      // Spider-Man player
      spiderPlayer = new Tone.Player({
        url: 'audio/spiderman.mp3',
        loop: true,
        volume: -60,
      }).connect(masterVol);

      // Frequency analyser
      try {
        const rawCtx = Tone.context.rawContext || Tone.context;
        analyser = rawCtx.createAnalyser ? rawCtx.createAnalyser() : Tone.context.createAnalyser();
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        masterVol.connect(analyser);
      } catch (err) {
        console.warn('Analyser setup fallback:', err);
      }

      // Asynchronous buffer load notification
      Tone.loaded().then(() => {
        audioReady = true;
        console.log('Audio system initialized. All tracks loaded.');
      }).catch(err => {
        console.warn('Tone.loaded notice:', err);
        audioReady = true;
      });
    }

    
    // --- Songs HUD UI ---
    function renderTrackHUD() {
      const container = document.getElementById('songs-list');
      if (!container) return;
      container.innerHTML = '';
      trackProfiles.forEach(track => {
        const item = document.createElement('div');
        item.className = 'song-item' + (currentTrackId === track.id ? ' active' : '');
        item.id = `song-item-${track.id}`;
        item.innerHTML = `
          <div class="song-title">
            <span class="song-indicator">${currentTrackId === track.id ? '▶' : '•'}</span>
            <span>${track.name}</span>
          </div>
          <span class="song-tag">${track.mood}</span>
        `;
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          startExperience().then(() => {
            if (currentTrackId !== track.id) {
              if (isPlaying) {
                crossfadeTo(track.id);
              } else {
                startTrack(track.id);
                startVisualLoop();
              }
            }
          });
        });
        container.appendChild(item);
      });
    }

    function updateTrackHUD() {
      document.querySelectorAll('.song-item').forEach(el => {
        el.classList.remove('active');
        const ind = el.querySelector('.song-indicator');
        if (ind) ind.textContent = '•';
      });
      if (currentTrackId) {
        const activeEl = document.getElementById(`song-item-${currentTrackId}`);
        if (activeEl) {
          activeEl.classList.add('active');
          const ind = activeEl.querySelector('.song-indicator');
          if (ind) ind.textContent = '▶';
        }
      }
    }

    // Preload audio immediately on page load
    function preloadAudio() {
      if (typeof Tone === 'undefined') return;

      try {
        Tone.Destination.volume.value = 0;
        if (!masterVol) {
          masterVol = new Tone.Volume(volumeToDb(masterVolume)).toDestination();
        }

        if (!analyser) {
          try {
            const rawCtx = Tone.context.rawContext || Tone.context;
            analyser = rawCtx.createAnalyser ? rawCtx.createAnalyser() : Tone.context.createAnalyser();
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            masterVol.connect(analyser);
          } catch (err) {
            console.warn('Analyser setup fallback:', err);
          }
        }

        trackProfiles.forEach(track => {
          if (!players[track.id]) {
            const player = new Tone.Player({
              url: `audio/${track.filename}`,
              loop: true,
              volume: -60,
            }).connect(masterVol);
            players[track.id] = player;
          }
        });

        if (!spiderPlayer) {
          spiderPlayer = new Tone.Player({
            url: 'audio/spiderman.mp3',
            loop: true,
            volume: -60,
          }).connect(masterVol);
        }

        Tone.loaded().then(() => {
          audioReady = true;
          console.log('All audio tracks preloaded and ready!');
          const badge = document.getElementById('songs-count-badge');
          if (badge) badge.textContent = '10 READY';
        }).catch(err => {
          console.warn('Tone.loaded notice:', err);
          audioReady = true;
        });
      } catch (err) {
        console.error('Preload error:', err);
      }
    }

    function volumeToDb(vol) {
      if (vol <= 0) return -60;
      return 20 * Math.log10(vol);
    }

    function getFrequencyBands() {
      if (!analyser || !dataArray) return { bass: 0, mid: 0, high: 0 };
      analyser.getByteFrequencyData(dataArray);
      const bass = average(dataArray.slice(0, 10));
      const mid = average(dataArray.slice(10, 40));
      const high = average(dataArray.slice(40, 128));
      return { bass, mid, high };
    }

    function average(arr) {
      if (arr.length === 0) return 0;
      return arr.reduce((a, b) => a + b, 0) / arr.length;
    }

    // Timers to safely stop players without zombie timeouts
    const stopTimers = {};

    function stopPlayer(player, id, fadeDuration = 1.5) {
      if (!player) return;
      if (stopTimers[id]) {
        clearTimeout(stopTimers[id]);
        delete stopTimers[id];
      }
      if (player.state === 'started') {
        player.volume.rampTo(-60, fadeDuration);
        stopTimers[id] = setTimeout(() => {
          try { player.stop(); } catch (e) { }
          delete stopTimers[id];
        }, (fadeDuration + 0.1) * 1000);
      }
    }

    function cancelStop(id) {
      if (stopTimers[id]) {
        clearTimeout(stopTimers[id]);
        delete stopTimers[id];
      }
    }

    // Crossfade between tracks over 2s
    function crossfadeTo(newTrackId) {
      if (currentTrackId === newTrackId || isCrossfading) return;
      isCrossfading = true;

      const fadeOutPlayer = players[currentTrackId];
      const fadeInPlayer = players[newTrackId];

      if (!fadeInPlayer || !fadeInPlayer.loaded) {
        console.warn(`Track ${newTrackId} not yet loaded, skipping crossfade`);
        isCrossfading = false;
        return;
      }

      cancelStop(newTrackId);
      if (currentTrackId && fadeOutPlayer) {
        stopPlayer(fadeOutPlayer, currentTrackId, 2.0);
      }

      try {
        if (fadeInPlayer.state !== 'started') {
          fadeInPlayer.start();
        }
      } catch (e) { }

      fadeInPlayer.volume.cancelScheduledValues(Tone.now());
      fadeInPlayer.volume.setValueAtTime(-24, Tone.now());
      fadeInPlayer.volume.rampTo(0, 2.0);

      currentTrackId = newTrackId;

      const track = trackProfiles.find(t => t.id === newTrackId);
      if (track) {
        trackNameEl.textContent = '⚡ NOW PLAYING: ' + track.name;
        trackNameEl.classList.add('visible');
        updateTrackHUD();
      }

      setTimeout(() => { isCrossfading = false; }, 2100);
    }

    // Start a track from silence

      const player = players[trackId];
      if (!player || !player.loaded) {
        console.warn(`Track ${trackId} not yet loaded`);
        return;
      }

      cancelStop(trackId);

      if (Tone.context.state !== 'running') {
        try { Tone.context.resume(); } catch (e) { }
      }

      try {
        if (player.state !== 'started') {
          player.start();
        }
      } catch (e) { }

      player.volume.cancelScheduledValues(Tone.now());
      player.volume.setValueAtTime(-24, Tone.now());
      player.volume.rampTo(0, 0.6);
      currentTrackId = trackId;
      isPlaying = true;

      const track = trackProfiles.find(t => t.id === trackId);
      if (track) {
        trackNameEl.textContent = '⚡ NOW PLAYING: ' + track.name;
        trackNameEl.classList.add('visible');
        updateTrackHUD();
      }
    }

      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);

    const HAND_CONNECTIONS = [

    // --- Movement Fingerprint Buffer & Computation ---
    const positionBuffer = []; // { x, y, t }

    function computeSpeed(buffer) {
      if (buffer.length < 2) return 0;
      let totalDist = 0;
      for (let i = 1; i < buffer.length; i++) {
        const dx = buffer[i].x - buffer[i - 1].x;
        const dy = buffer[i].y - buffer[i - 1].y;
        totalDist += Math.sqrt(dx * dx + dy * dy);
      }
      const totalTime = (buffer[buffer.length - 1].t - buffer[0].t) / 1000;
      if (totalTime <= 0) return 0;
      const speed = totalDist / totalTime;
      return clamp(speed / 1.2, 0, 1);
    }

    function computeSmoothness(buffer) {
      if (buffer.length < 4) return 0.8;
      const velocities = [];
      for (let i = 1; i < buffer.length; i++) {
        const dx = buffer[i].x - buffer[i - 1].x;
        const dy = buffer[i].y - buffer[i - 1].y;
        const dt = (buffer[i].t - buffer[i - 1].t) / 1000;
        if (dt > 0.005) {
          velocities.push({ vx: dx / dt, vy: dy / dt });
        }
      }
      if (velocities.length < 2) return 0.8;
      let jerkSum = 0;
      for (let i = 1; i < velocities.length; i++) {
        const dvx = velocities[i].vx - velocities[i - 1].vx;
        const dvy = velocities[i].vy - velocities[i - 1].vy;
        jerkSum += Math.sqrt(dvx * dvx + dvy * dvy);
      }
      const avgJerk = jerkSum / (velocities.length - 1);
      return clamp(1 - (avgJerk / 4.0), 0, 1);
    }

    function computeFingerSpread(landmarks) {
      const palmSize = dist(landmarks[0], landmarks[9]) || 0.1;
      const d1 = dist(landmarks[4], landmarks[8]);
      const d2 = dist(landmarks[8], landmarks[12]);
      const d3 = dist(landmarks[12], landmarks[16]);
      const d4 = dist(landmarks[16], landmarks[20]);
      const totalSpread = (d1 + d2 + d3 + d4) / palmSize;
      return clamp((totalSpread - 0.9) / 1.6, 0, 1);
    }

    function extractMovementFingerprint(landmarks) {
      const wrist = landmarks[0];
      const now = Date.now();

      positionBuffer.push({ x: wrist.x, y: wrist.y, t: now });
      if (positionBuffer.length > 30) positionBuffer.shift();

      const speed = computeSpeed(positionBuffer);
      const smoothness = computeSmoothness(positionBuffer);
      const height = clamp(1 - wrist.y, 0, 1);
      const spread = computeFingerSpread(landmarks);

      return {
        tempo: clamp(speed * 0.7 + spread * 0.3, 0.05, 1),
        aggression: clamp(speed * (1 - smoothness * 0.5) + (1 - height) * 0.2, 0.05, 1),
        darkness: clamp(1 - height, 0.05, 1),
        chaos: clamp(1 - smoothness, 0.05, 1)
      };
    }

    function cosineSimilarity(a, b) {
      const keys = ['tempo', 'aggression', 'darkness', 'chaos'];
      const dot = keys.reduce((sum, k) => sum + (a[k] || 0) * (b[k] || 0), 0);
      const magA = Math.sqrt(keys.reduce((sum, k) => sum + (a[k] || 0) ** 2, 0));
      const magB = Math.sqrt(keys.reduce((sum, k) => sum + (b[k] || 0) ** 2, 0));
      if (magA === 0 || magB === 0) return 0;
      return dot / (magA * magB);
    }

    function getBestMatch(fingerprint) {
      let best = { track: trackProfiles[0], score: -1 };
      for (const track of trackProfiles) {

        if (score > best.score) {
          best = { track, score };
        }
      }
      return best;
    }

    function detectWristRotation(landmarks) {
      if (!prevLandmarks) return 0;

      const wrist = landmarks[0];
      const middleMCP = landmarks[9];
      const prevWrist = prevLandmarks[0];
      const prevMiddleMCP = prevLandmarks[9];

      // Translation check — wrist must be relatively still
      const tx = Math.abs(wrist.x - prevWrist.x);
      const ty = Math.abs(wrist.y - prevWrist.y);
      const translation = Math.sqrt(tx * tx + ty * ty);

      if (translation > 0.035) return 0; // moving around, not rotating

      // Compute angle of wrist→middleMCP vector in mirrored screen space
      const vx = -(middleMCP.x - wrist.x);
      const vy = middleMCP.y - wrist.y;
      const prevVx = -(prevMiddleMCP.x - prevWrist.x);
      const prevVy = prevMiddleMCP.y - prevWrist.y;

      const angle = Math.atan2(vy, vx);
      const prevAngle = Math.atan2(prevVy, prevVx);

      let delta = angle - prevAngle;
      if (delta > Math.PI) delta -= 2 * Math.PI;
      if (delta < -Math.PI) delta += 2 * Math.PI;

      if (Math.abs(delta) < 0.04) return 0;

      return delta;

      const angles = Array.from({ length: 8 }, (_, i) => (i / 8) * Math.PI * 2);

        webLines.push({
          ox: originX,
          oy: originY,
          angle: angle,
          progress: 0,
          maxLen: Math.max(window.innerWidth, window.innerHeight) * 0.8,
          startTime: Date.now(),
          duration: 600,
        });
      });
    }

    function drawWebLines() {
      const now = Date.now();
      for (let i = webLines.length - 1; i >= 0; i--) {
        const line = webLines[i];
        const elapsed = now - line.startTime;
        line.progress = Math.min(elapsed / line.duration, 1);

        const len = line.progress * line.maxLen;
        const endX = line.ox + Math.cos(line.angle) * len;
        const endY = line.oy + Math.sin(line.angle) * len;

        const alpha = 1 - line.progress * 0.7;

        ctx.beginPath();
        ctx.moveTo(line.ox, line.oy);
        ctx.lineTo(endX, endY);
        ctx.strokeStyle = `rgba(220, 38, 38, ${alpha})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        if (line.progress >= 1) {
          webLines.splice(i, 1);

    function enterSpiderManMode(handX, handY) {
      if (isSpiderManMode) return;
      isSpiderManMode = true;

      // Clear any release timer
      if (spiderManReleaseTimer) {
        clearTimeout(spiderManReleaseTimer);
        spiderManReleaseTimer = null;
      }

      // City overlay
      cityOverlay.classList.add('active');

      // Fire web shot from hand position
      fireWebShot(handX * window.innerWidth, handY * window.innerHeight);

      // Crossfade to Spider-Man track
      Object.values(players).forEach(p => {
        if (p.state === 'started') {
          p.volume.rampTo(-60, 2);
          setTimeout(() => { try { p.stop(); } catch (e) { } }, 2100);
        }
      });

      spiderPlayer.volume.value = -60;
      try { spiderPlayer.start(); } catch (e) { }
      spiderPlayer.volume.rampTo(0, 2);

      trackNameEl.textContent = 'Spider-Man';
      trackNameEl.classList.add('visible');

      // Start visual loop for Spider-Man mode
      startVisualLoop();
    }

    function exitSpiderManMode() {
      if (!isSpiderManMode) return;

      spiderManReleaseTimer = setTimeout(() => {
        isSpiderManMode = false;

        // Fade city overlay
        cityOverlay.classList.remove('active');

        // Stop spider track
        if (spiderPlayer.state === 'started') {
          spiderPlayer.volume.rampTo(-60, 3);
          setTimeout(() => { try { spiderPlayer.stop(); } catch (e) { } }, 3100);
        }

        // Re-match a phonk track
        currentTrackId = null;
        isPlaying = false;
        spiderManCounter = 0;
        spiderManReleaseTimer = null;
      }, 3000);
    }


    // ============================================
    // STEP 4 & 10 — MediaPipe Hands + No-Hand State
    // ============================================

    let handPresent = false;
    let handLostTime = 0;
    const HAND_LOST_DEBOUNCE = 600; // ms
    let systemState = 'IDLE'; // IDLE, READING, PLAYING, ROTATING, SPIDER_MAN
    let appStarted = false;
    let lastMatchTime = 0;
    const MATCH_INTERVAL = 2500; // 3 seconds between continuous track re-evaluations
    const SWITCH_DELTA = 0.04;

    function showError(msg) {
      errorMessage.textContent = msg;
      errorScreen.classList.add('active');
    }

    // Start experience handler
    async function startExperience() {
      if (appStarted) return;
      appStarted = true;
      startScreen.classList.add('hidden');

      try {
        await Tone.start();
        console.log('AudioContext started:', Tone.context.state);
        if (!masterVol) preloadAudio();
      } catch (e) {
        console.error('Audio init failed:', e);
      }

      initMediaPipe().catch(e => console.error('MediaPipe init failed:', e));
    }

    startScreen.addEventListener('click', startExperience);
    const startBtn = document.getElementById('start-btn');
    if (startBtn) startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startExperience();
    });
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') startExperience();
    });

    // Initialize HUD and preload audio immediately on load
    renderTrackHUD();
    preloadAudio();

    async function initMediaPipe() {
      // 1. Get camera stream directly on webcam preview
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            facingMode: 'user'
          }
        });
        webcamPreview.srcObject = stream;
        await webcamPreview.play();
      } catch (e) {
        console.error('Camera access failed:', e);
        showError('Camera access required — please allow webcam access in your browser and refresh');
        throw e;
      }

      // 2. Initialize MediaPipe Hands
      let hands;
      try {
        if (typeof Hands === 'undefined') {
          throw new Error('MediaPipe Hands library is not loaded');
        }
        hands = new Hands({
          locateFile: (file) => `mediapipe/${file}`
        });

        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 0,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5,
        });

        hands.onResults(onHandResults);
      } catch (e) {
        console.error('MediaPipe setup failed:', e);
        showError('Hand tracking models failed to load — check connection');
        throw e;
      }

      // 3. Reliable frame pump
      let isProcessing = false;
      async function sendFrame() {
        if (webcamPreview.readyState >= 2 && !isProcessing) {
          isProcessing = true;
          try {
            await hands.send({ image: webcamPreview });
          } catch (e) {
            console.error('Hands send error:', e);
          } finally {
            isProcessing = false;
          }
        }
        requestAnimationFrame(sendFrame);
      }

      requestAnimationFrame(sendFrame);
      console.log('MediaPipe Hands initialized and running.');
    }


    // ============================================
    // STEP 11 — Main Loop (onResults callback)
    // ============================================

    function onHandResults(results) {
      if (!appStarted) return;

      const now = Date.now();

      // Clear overlay canvas
      ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      // Draw any active web lines
      drawWebLines();

      // --- Priority 1: Check if hand is present ---
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        if (handPresent) {
          if (handLostTime === 0) handLostTime = now;

          // Debounce: only trigger idle after 600ms
          if (now - handLostTime > HAND_LOST_DEBOUNCE) {
            handPresent = false;
            systemState = 'IDLE';
            stopAllMusic();
            dimAllWindows();
            positionBuffer.length = 0;
            prevLandmarks = null;
            spiderManCounter = 0;
            wCtx.clearRect(0, 0, webcamCanvas.width, webcamCanvas.height);
            wCtx.save();
            wCtx.translate(webcamCanvas.width, 0);
            wCtx.scale(-1, 1);
            wCtx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            wCtx.fillRect(4, 4, webcamCanvas.width - 8, 20);
            wCtx.fillStyle = '#94a3b8';
            wCtx.font = '9px monospace';
            wCtx.textAlign = 'center';
            wCtx.textBaseline = 'middle';
            wCtx.fillText('WAITING FOR HAND...', webcamCanvas.width / 2, 14);
            wCtx.restore();

            if (isSpiderManMode) {
              isSpiderManMode = false;
              cityOverlay.classList.remove('active');
            }
          }
        }
        return;
      }

      // Hand is present
      handPresent = true;
      handLostTime = 0;
      const landmarks = results.multiHandLandmarks[0];

      // If audio buffers are still loading, show skeleton & loading text
      if (!audioReady) {
        drawHandSkeleton(landmarks, 'Loading audio tracks...');
        prevLandmarks = landmarks;
        return;
      }

      // --- Priority 2: Spider-Man Pose Check ---
      const spiderPose = isSpiderManPose(landmarks);

      if (spiderPose) {
        spiderManCounter++;

        // Draw progress ring (mirrored hand X)
        const handX = 1 - landmarks[9].x;
        const handY = landmarks[9].y;
        const progress = Math.min(spiderManCounter / SPIDER_MAN_THRESHOLD, 1);
        drawSpiderProgress(
          handX * overlayCanvas.width,
          handY * overlayCanvas.height,
          progress
        );

        if (spiderManCounter >= SPIDER_MAN_THRESHOLD) {
          if (!isSpiderManMode) {
            enterSpiderManMode(handX, handY);
            systemState = 'SPIDER_MAN';
          }
          if (spiderManReleaseTimer) {
            clearTimeout(spiderManReleaseTimer);
            spiderManReleaseTimer = null;
          }
        }

        drawHandSkeleton(landmarks, '🕷️ SPIDER-MAN');
        prevLandmarks = landmarks;

        if (isSpiderManMode) {
          const bands = getFrequencyBands();
          updateWindows(bands.bass, bands.mid, bands.high);
          checkBeatDrop(bands.bass);
        }
        return;
      } else {
        if (spiderManCounter > 0) spiderManCounter = 0;
        if (isSpiderManMode) {
          exitSpiderManMode();
        }
      }

      // --- Priority 3: Volume Rotation Gesture ---
      const rotationDelta = detectWristRotation(landmarks);
      if (rotationDelta !== 0) {
        masterVolume = clamp(masterVolume + rotationDelta * 0.45, 0, 1);
        if (masterVol) {
          masterVol.volume.value = volumeToDb(masterVolume);
        }

        showVolumeArc = true;
        rotationInactiveFrames = 0;

        if (volumeArcFadeTimer) clearTimeout(volumeArcFadeTimer);
        volumeArcFadeTimer = setTimeout(() => {
          showVolumeArc = false;
        }, 1500);

        systemState = 'ROTATING';
      } else {
        rotationInactiveFrames++;
        if (rotationInactiveFrames > 10 && systemState === 'ROTATING') {
          systemState = 'PLAYING';
        }
      }

      // Draw volume arc if active
      if (showVolumeArc) {
        const wrist = landmarks[0];
        const screenWristX = (1 - wrist.x) * overlayCanvas.width;
        const screenWristY = wrist.y * overlayCanvas.height;
        drawVolumeArc(
          screenWristX,
          screenWristY,
          masterVolume
        );
      }

      // --- Priority 4: Movement Fingerprint & Track Matching ---
      const fingerprint = extractMovementFingerprint(landmarks);
      const best = getBestMatch(fingerprint);

      if (!isPlaying) {
        // Start playing matched track once hand has a few frames of history
        if (positionBuffer.length >= 3) {
          startTrack(best.track.id);
          startVisualLoop();
          systemState = 'PLAYING';
          lastMatchTime = now;
        }
      } else if (!isSpiderManMode && (now - lastMatchTime > MATCH_INTERVAL)) {
        // Continuous smooth re-evaluation every 3 seconds
        const currentProfile = trackProfiles.find(t => t.id === currentTrackId);
        const currentScore = currentProfile ? cosineSimilarity(fingerprint, currentProfile) : 0;

        if (best.track.id !== currentTrackId && (best.score - currentScore > SWITCH_DELTA)) {
          crossfadeTo(best.track.id);
          lastMatchTime = now;
        }
      }

      // Draw hand skeleton with current mood/track status on webcam canvas
      const activeTrack = trackProfiles.find(t => t.id === currentTrackId);
      const activeName = activeTrack ? activeTrack.name.split('—')[0].trim() : 'MATCHING';
      const matchName = best.track ? best.track.name.split('—')[0].trim() : '';
      const debugText = `${activeName} [Match: ${matchName}] | Vol ${Math.round(masterVolume * 100)}%`;
      drawHandSkeleton(landmarks, debugText);

      // Store landmarks for next frame
      prevLandmarks = landmarks;
    }
  </script>
