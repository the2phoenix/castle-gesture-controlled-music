<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castle Phonk</title>
  <meta name="description"
    content="Castle Phonk — A gesture-controlled phonk music visualizer. Move your hand to control the music.">
  <!-- Run with: python -m http.server 8080 or VS Code Live Server -->
  <!-- Do NOT open via file:// — audio CORS requires same-origin serving -->

  <!-- Google Fonts: Cinzel for gothic elegance -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================
       STEP 2 — CSS (from uiux.md)
       ============================================ */

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0A0A14;
      font-family: 'Cinzel', serif;
      cursor: default;
      user-select: none;
    }

    /* --- Castle Background --- */
    #castle-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center bottom;
      z-index: 0;
      filter: brightness(0.75) contrast(1.1) saturate(0.9);
    }

    /* --- Fog Layer --- */
    #fog-layer {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 30%;
      background: linear-gradient(to top, rgba(180, 200, 220, 0.12), transparent);
      animation: fogDrift 8s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes fogDrift {
      from {
        opacity: 0.6;
        transform: translateX(-1%);
      }

      to {
        opacity: 1.0;
        transform: translateX(1%);
      }
    }

    /* --- Sky Overlay (star twinkle) --- */
    #sky-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.06;
      animation: starTwinkle 4s ease-in-out infinite alternate;
    }

    @keyframes starTwinkle {
      from {
        opacity: 0.03;
      }

      to {
        opacity: 0.08;
      }
    }

    /* --- Moon Overlay --- */
    #moon-overlay {
      position: absolute;
      top: 6%;
      right: 18%;
      width: 8%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 220, 0.15) 0%, transparent 70%);
      mix-blend-mode: screen;
      transition: filter 0.1s ease;
      pointer-events: none;
      z-index: 2;
    }

    /* --- City Overlay (Spider-Man Mode) --- */
    #city-overlay {
      position: fixed;
      inset: 0;
      background-image: url('spiderman-city.png');
      background-size: cover;
      background-position: center;
      opacity: 0;
      mix-blend-mode: overlay;
      transition: opacity 2s ease;
      z-index: 1;
      pointer-events: none;
    }

    #city-overlay.active {
      opacity: 0.55;
    }

    /* --- Castle Window Glow --- */
    .castle-window {
      position: absolute;
      border-radius: 50%;
      background: transparent;
      opacity: 0;
      mix-blend-mode: color-dodge;
      filter: blur(8px);
      pointer-events: none;
      z-index: 2;
      transform: translate(-50%, -50%);
      will-change: opacity, transform, filter;
    }

    .castle-window.lit {
      background: radial-gradient(circle at center,
          rgba(255, 255, 255, 0.8) 0%,
          var(--window-color) 40%,
          transparent 70%);
      box-shadow: 0 0 15px 5px var(--window-color),
        0 0 40px 20px color-mix(in srgb, var(--window-color) 30%, transparent);
    }

    #webcam-preview {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 180px;
      height: 135px;
      border-radius: 12px;
      opacity: 0.6;
      border: 1px solid rgba(255, 255, 255, 0.15);
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 30;
      transition: opacity 0.3s;
      background: #000;
    }

    #webcam-preview:hover {
      opacity: 0.9;
    }

    /* --- Webcam Canvas for Skeleton --- */
    #webcam-canvas {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 180px;
      height: 135px;
      border-radius: 12px;
      z-index: 31;
      pointer-events: none;
      transform: scaleX(-1);
      /* mirror */
    }

    /* --- Track Name --- */
    #track-name {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 0.25em;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 20;
      pointer-events: none;
    }

    #track-name.visible {
      opacity: 1;
    }

    /* --- Overlay Canvas --- */
    #overlay-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    /* --- Hidden Video for MediaPipe --- */
    #input-video {
      display: none;
    }

    /* --- Start Screen --- */
    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 20, 0.7);
      cursor: pointer;
      transition: opacity 1s ease;
    }

    #start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #start-screen h1 {
      font-family: 'Cinzel', serif;
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.15em;
      margin-bottom: 24px;
      text-shadow: 0 0 40px rgba(124, 58, 237, 0.5), 0 0 80px rgba(124, 58, 237, 0.2);
    }

    #start-screen p {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    #start-screen .click-hint {
      margin-top: 48px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.3em;
      animation: pulseFade 2s ease-in-out infinite;
    }

    @keyframes pulseFade {

      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 0.7;
      }
    }

    /* --- Error Screen --- */
    #error-screen {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 20, 0.9);
    }

    #error-screen.active {
      display: flex;
    }

    #error-screen p {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
      max-width: 500px;
      line-height: 2;
    }
  </style>
</head>

<body>

  <!-- ============================================
       STEP 1 — HTML Structure
       ============================================ -->

  <!-- Castle Background -->
  <img id="castle-bg" src="castle.png" alt="Gothic Castle">

  <!-- Atmosphere Layers -->
  <div id="fog-layer"></div>
  <div id="sky-overlay" id="sky-stars"></div>
  <div id="moon-overlay"></div>

  <!-- City Overlay (Spider-Man Mode) -->
  <div id="city-overlay"></div>

  <!-- Castle Windows Container -->
  <div id="windows-container">
    <!-- 18 windows will be created by JS -->
  </div>

  <!-- Overlay Canvas (volume arc, web effects) -->
  <canvas id="overlay-canvas"></canvas>

  <!-- Webcam Preview -->
  <video id="webcam-preview" autoplay playsinline></video>
  <canvas id="webcam-canvas"></canvas>

  <!-- Hidden Video for MediaPipe -->
  <video id="input-video" autoplay playsinline></video>

  <!-- Track Name Display -->
  <div id="track-name"></div>

  <!-- Start Screen -->
  <div id="start-screen">
    <h1>CASTLE PHONK</h1>
    <p>move your hand to begin</p>
    <p class="click-hint">[ click anywhere ]</p>
  </div>

  <!-- Error Screen -->
  <div id="error-screen">
    <p id="error-message"></p>
  </div>

  <!-- ============================================
       CDN Dependencies
       ============================================ -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" crossorigin="anonymous"></script>

  <script>
    // ============================================
    // Castle Phonk — Main Application
    // ============================================

    // --- DOM References ---
    const castleBg = document.getElementById('castle-bg');
    const fogLayer = document.getElementById('fog-layer');
    const moonOverlay = document.getElementById('moon-overlay');
    const cityOverlay = document.getElementById('city-overlay');
    const overlayCanvas = document.getElementById('overlay-canvas');
    const ctx = overlayCanvas.getContext('2d');
    const webcamPreview = document.getElementById('webcam-preview');
    const webcamCanvas = document.getElementById('webcam-canvas');
    const wCtx = webcamCanvas.getContext('2d');
    const inputVideo = document.getElementById('input-video');
    const trackNameEl = document.getElementById('track-name');
    const startScreen = document.getElementById('start-screen');
    const errorScreen = document.getElementById('error-screen');
    const errorMessage = document.getElementById('error-message');

    // --- Canvas Sizing ---
    function resizeCanvas() {
      overlayCanvas.width = window.innerWidth;
      overlayCanvas.height = window.innerHeight;

      webcamCanvas.width = 180;
      webcamCanvas.height = 135;

      resizeWindowsContainer();
    }

    function resizeWindowsContainer() {
      if (!castleBg.complete) return;
      const imgW = castleBg.naturalWidth;
      const imgH = castleBg.naturalHeight;
      if (!imgW || !imgH) return;

      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const imgRatio = imgW / imgH;
      const winRatio = winW / winH;

      let finalW, finalH, finalX, finalY;
      if (winRatio > imgRatio) {
        finalW = winW;
        finalH = winW / imgRatio;
        finalX = 0;
        finalY = winH - finalH;
      } else {
        finalH = winH;
        finalW = winH * imgRatio;
        finalX = (winW - finalW) / 2;
        finalY = winH - finalH;
      }

      const wc = document.getElementById('windows-container');
      wc.style.position = 'fixed';
      wc.style.left = finalX + 'px';
      wc.style.top = finalY + 'px';
      wc.style.width = finalW + 'px';
      wc.style.height = finalH + 'px';
      wc.style.pointerEvents = 'none';
      wc.style.zIndex = '1';
    }

    castleBg.addEventListener('load', resizeWindowsContainer);
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- Star field generation for sky overlay ---
    (function generateStars() {
      const skyOverlay = document.getElementById('sky-overlay');
      const starCanvas = document.createElement('canvas');
      starCanvas.width = 800;
      starCanvas.height = 400;
      const sctx = starCanvas.getContext('2d');
      for (let i = 0; i < 120; i++) {
        const x = Math.random() * 800;
        const y = Math.random() * 400;
        const r = Math.random() * 1.5 + 0.3;
        const a = Math.random() * 0.6 + 0.2;
        sctx.beginPath();
        sctx.arc(x, y, r, 0, Math.PI * 2);
        sctx.fillStyle = `rgba(255,255,240,${a})`;
        sctx.fill();
      }
      skyOverlay.style.backgroundImage = `url(${starCanvas.toDataURL()})`;
      skyOverlay.style.backgroundRepeat = 'repeat';
    })();


    // ============================================
    // STEP 3 — Audio System
    // ============================================

    // Track energy profiles (from TRD.md)
    const trackProfiles = [
      { id: 1, filename: 'track01.mp3', name: 'Track 01', tempo: 0.2, aggression: 0.3, darkness: 0.8, chaos: 0.2 },
      { id: 2, filename: 'track02.mp3', name: 'Track 02', tempo: 0.9, aggression: 0.9, darkness: 0.7, chaos: 0.8 },
      { id: 3, filename: 'track03.mp3', name: 'Track 03', tempo: 0.5, aggression: 0.5, darkness: 0.6, chaos: 0.4 },
      { id: 4, filename: 'track04.mp3', name: 'Track 04', tempo: 0.1, aggression: 0.2, darkness: 0.9, chaos: 0.1 },
      { id: 5, filename: 'track05.mp3', name: 'Track 05', tempo: 0.7, aggression: 0.6, darkness: 0.5, chaos: 0.6 },
      { id: 6, filename: 'track06.mp3', name: 'Track 06', tempo: 0.4, aggression: 0.7, darkness: 0.8, chaos: 0.5 },
      { id: 7, filename: 'track07.mp3', name: 'Track 07', tempo: 0.8, aggression: 0.8, darkness: 0.4, chaos: 0.7 },
      { id: 8, filename: 'track08.mp3', name: 'Track 08', tempo: 0.3, aggression: 0.4, darkness: 0.7, chaos: 0.3 },
      { id: 9, filename: 'track09.mp3', name: 'Track 09', tempo: 0.6, aggression: 0.5, darkness: 0.6, chaos: 0.9 },
      { id: 10, filename: 'track10.mp3', name: 'Track 10', tempo: 0.5, aggression: 0.6, darkness: 0.9, chaos: 0.5 },
    ];

    // Audio state
    let players = {};
    let spiderPlayer = null;
    let analyser = null;
    let dataArray = null;
    let currentTrackId = null;
    let masterVolume = 0.6; // 0–1
    let audioReady = false;
    let isPlaying = false;
    let isCrossfading = false;

    async function initAudio() {
      await Tone.start();

      // Create master volume node
      const masterVol = new Tone.Volume(volumeToDb(masterVolume)).toDestination();

      // Load all track players
      trackProfiles.forEach(track => {
        const player = new Tone.Player({
          url: `audio/${track.filename}`,
          loop: true,
          volume: -60, // start silent
        }).connect(masterVol);
        players[track.id] = player;
      });

      // Spider-Man player
      spiderPlayer = new Tone.Player({
        url: 'audio/spiderman.mp3',
        loop: true,
        volume: -60,
      }).connect(masterVol);

      // Wait for all buffers to load
      await Tone.loaded();

      // Frequency analyser
      analyser = Tone.context.createAnalyser();
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      Tone.Destination.connect(analyser);

      audioReady = true;
      console.log('Audio system initialized. All tracks loaded.');
    }

    function volumeToDb(vol) {
      if (vol <= 0) return -60;
      return 20 * Math.log10(vol);
    }

    function getFrequencyBands() {
      if (!analyser || !dataArray) return { bass: 0, mid: 0, high: 0 };
      analyser.getByteFrequencyData(dataArray);
      const bass = average(dataArray.slice(0, 10));
      const mid = average(dataArray.slice(10, 40));
      const high = average(dataArray.slice(40, 128));
      return { bass, mid, high };
    }

    function average(arr) {
      if (arr.length === 0) return 0;
      return arr.reduce((a, b) => a + b, 0) / arr.length;
    }

    // Crossfade between tracks over 2s
    function crossfadeTo(newTrackId) {
      if (currentTrackId === newTrackId || isCrossfading) return;
      isCrossfading = true;

      const fadeOutPlayer = players[currentTrackId];
      const fadeInPlayer = players[newTrackId];

      if (!fadeInPlayer || !fadeInPlayer.loaded) {
        console.error(`Track ${newTrackId} not loaded, skipping`);
        isCrossfading = false;
        return;
      }

      // Fade out old
      if (fadeOutPlayer && fadeOutPlayer.state === 'started') {
        fadeOutPlayer.volume.rampTo(-60, 2);
        setTimeout(() => {
          try { fadeOutPlayer.stop(); } catch (e) { }
        }, 2100);
      }

      // Fade in new
      fadeInPlayer.volume.value = -60;
      try { fadeInPlayer.start(); } catch (e) { }
      fadeInPlayer.volume.rampTo(0, 2);

      const oldId = currentTrackId;
      currentTrackId = newTrackId;

      // Update track name
      const track = trackProfiles.find(t => t.id === newTrackId);
      if (track) {
        trackNameEl.textContent = track.name;
        trackNameEl.classList.add('visible');
      }

      setTimeout(() => { isCrossfading = false; }, 2100);
    }

    // Start a track from silence
    function startTrack(trackId) {
      const player = players[trackId];
      if (!player || !player.loaded) return;

      player.volume.value = -60;
      try { player.start(); } catch (e) { }
      player.volume.rampTo(0, 1.5);
      currentTrackId = trackId;
      isPlaying = true;

      const track = trackProfiles.find(t => t.id === trackId);
      if (track) {
        trackNameEl.textContent = track.name;
        trackNameEl.classList.add('visible');
      }
    }

    // Stop all music
    function stopAllMusic() {
      Object.values(players).forEach(p => {
        if (p.state === 'started') {
          p.volume.rampTo(-60, 1.5);
          setTimeout(() => { try { p.stop(); } catch (e) { } }, 1600);
        }
      });
      if (spiderPlayer && spiderPlayer.state === 'started') {
        spiderPlayer.volume.rampTo(-60, 1.5);
        setTimeout(() => { try { spiderPlayer.stop(); } catch (e) { } }, 1600);
      }
      currentTrackId = null;
      isPlaying = false;
      trackNameEl.classList.remove('visible');
      stopVisualLoop();
    }

    // Beat detection
    let lastBeatTime = 0;
    function checkBeatDrop(bass) {
      const now = Date.now();
      if (bass > 200 && now - lastBeatTime > 300) {
        lastBeatTime = now;
        onBeatDrop();
      }
    }


    // ============================================
    // STEP 5 — Specific Gesture Track Mapping
    // ============================================

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12], [9, 13], [13, 14], [14, 15],
      [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]
    ];

    function drawHandSkeleton(landmarks) {
      wCtx.clearRect(0, 0, webcamCanvas.width, webcamCanvas.height);
      wCtx.strokeStyle = 'rgba(0, 255, 255, 0.6)';
      wCtx.lineWidth = 2;
      for (let i = 0; i < HAND_CONNECTIONS.length; i++) {
        const [a, b] = HAND_CONNECTIONS[i];
        wCtx.beginPath();
        wCtx.moveTo(landmarks[a].x * webcamCanvas.width, landmarks[a].y * webcamCanvas.height);
        wCtx.lineTo(landmarks[b].x * webcamCanvas.width, landmarks[b].y * webcamCanvas.height);
        wCtx.stroke();
      }
      wCtx.fillStyle = 'rgba(255, 0, 255, 0.6)';
      for (let i = 0; i < landmarks.length; i++) {
        wCtx.beginPath();
        wCtx.arc(landmarks[i].x * webcamCanvas.width, landmarks[i].y * webcamCanvas.height, 3, 0, 2 * Math.PI);
        wCtx.fill();
      }
    }

    function classifyPose(landmarks) {
      // Extended checks based on tips relative to PIP joints
      const th = dist(landmarks[4], landmarks[0]) > 0.15; // Thumb extended from wrist
      const ind = landmarks[8].y < landmarks[5].y - 0.02;
      const mid = landmarks[12].y < landmarks[9].y - 0.02;
      const rin = landmarks[16].y < landmarks[13].y - 0.02;
      const pin = landmarks[20].y < landmarks[17].y - 0.02;

      // Closed checks
      const indClosed = landmarks[8].y > landmarks[6].y;
      const midClosed = landmarks[12].y > landmarks[10].y;
      const rinClosed = landmarks[16].y > landmarks[14].y;
      const pinClosed = landmarks[20].y > landmarks[18].y;

      // Touch checks
      const touchThInd = dist(landmarks[4], landmarks[8]) < 0.06;
      const touchThMid = dist(landmarks[4], landmarks[12]) < 0.06;
      const touchThRin = dist(landmarks[4], landmarks[16]) < 0.06;
      const touchThPin = dist(landmarks[4], landmarks[20]) < 0.08;

      // Together checks
      const blade2 = dist(landmarks[8], landmarks[12]) < 0.06 && ind && mid && rinClosed && pinClosed;
      const blade3 = dist(landmarks[8], landmarks[12]) < 0.06 && dist(landmarks[12], landmarks[16]) < 0.06 && ind && mid && rin && pinClosed;

      const cluster = touchThInd && touchThMid && touchThRin && touchThPin && !ind && !mid && !rin && !pin;

      // Classifications
      if (cluster) return 5; // The Pinecone (All fingers touching thumb)

      // Mudras (Thumb touching one finger, others extended)
      if (touchThInd && !indClosed && mid && rin && pin) return 4; // Meditation (OK Sign)
      if (touchThMid && ind && !midClosed && rin && pin) return 1; // Snap Focus
      if (touchThRin && ind && mid && !rinClosed && pin) return 2; // Ring Mudra
      if (touchThPin && ind && mid && rin && !pinClosed) return 3; // Pinky Mudra

      // Blades
      if (blade3 && !th) return 7; // Triple Blade
      if (blade2 && !th) return 6; // Force Push (2-finger)

      // Gun
      if (th && ind && midClosed && rinClosed && pinClosed) return 8;

      // Horns
      if (!th && ind && midClosed && rinClosed && pin) return 9;

      // Teacup
      if (!th && indClosed && midClosed && rinClosed && pin) return 10;

      return null;
    }

    let activePose = null;
    let poseHoldFrames = 0;
    const POSE_HOLD_THRESHOLD = 20;


    // ============================================
    // STEP 6 — Gesture Detectors
    // ============================================

    let prevLandmarks = null;
    let rotationInactiveFrames = 0;
    let volumeArcFadeTimer = null;
    let showVolumeArc = false;

    // --- Volume Rotation ---
    function detectWristRotation(landmarks) {
      if (!prevLandmarks) return 0;

      const wrist = landmarks[0];
      const middleMCP = landmarks[9];
      const prevWrist = prevLandmarks[0];
      const prevMiddleMCP = prevLandmarks[9];

      // Translation check — wrist must be relatively still
      const tx = Math.abs(wrist.x - prevWrist.x);
      const ty = Math.abs(wrist.y - prevWrist.y);
      const translation = Math.sqrt(tx * tx + ty * ty);

      if (translation > 0.03) return 0; // too much hand movement

      // Compute angle of wrist→middleMCP vector
      const angle = Math.atan2(
        middleMCP.y - wrist.y,
        middleMCP.x - wrist.x
      );
      const prevAngle = Math.atan2(
        prevMiddleMCP.y - prevWrist.y,
        prevMiddleMCP.x - prevWrist.x
      );

      let delta = angle - prevAngle;
      if (delta > Math.PI) delta -= 2 * Math.PI;
      if (delta < -Math.PI) delta += 2 * Math.PI;

      if (Math.abs(delta) < 0.04) return 0; // not enough rotation

      return delta;
    }

    // --- Spider-Man Pose Detection ---
    let spiderManCounter = 0;
    const SPIDER_MAN_THRESHOLD = 45;
    let isSpiderManMode = false;
    let spiderManReleaseTimer = null;

    function getVector(p1, p2) {
      return { x: p2.x - p1.x, y: p2.y - p1.y, z: p2.z - p1.z };
    }

    function dotProduct(v1, v2) {
      return v1.x * v2.x + v1.y * v2.y + v1.z * v2.z;
    }

    function magnitude(v) {
      return Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
    }

    function angleBetween(v1, v2) {
      const dot = dotProduct(v1, v2);
      const mag = magnitude(v1) * magnitude(v2);
      if (mag === 0) return 0;
      return Math.acos(clamp(dot / mag, -1, 1)) * (180 / Math.PI); // Returns degrees
    }

    function isFingerExtended3D(mcp, pip, dip, tip) {
      // Create vectors for the finger segments
      const baseSegment = getVector(mcp, pip);
      const midSegment = getVector(pip, dip);
      const tipSegment = getVector(dip, tip);

      // If the finger is generally straight, the angles between these segments will be small (near 0)
      // If curled, the angles will be large (closer to 90 or 180)
      const angle1 = angleBetween(baseSegment, midSegment);
      const angle2 = angleBetween(midSegment, tipSegment);

      // Also check the overall straightness from base to tip
      const overallVector = getVector(mcp, tip);
      const angleOverall = angleBetween(baseSegment, overallVector);

      // Thresholds: if segments bend less than ~45 degrees rel to each other, it's extended
      return (angle1 < 45 && angle2 < 45 && angleOverall < 40);
    }

    // No separate isSpiderManPose function needed anymore. It's unified in classifyPose.

    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function classifyPose(landmarks) {
      // For the Thumb, the joints are 1 (CMC), 2 (MCP), 3 (IP), 4 (TIP)
      // But thumb bends differently, so we use the vector from 2->3 and 3->4
      const thumbBase = getVector(landmarks[2], landmarks[3]);
      const thumbTip = getVector(landmarks[3], landmarks[4]);
      const thumbAngle = angleBetween(thumbBase, thumbTip);

      // Also check if thumb is sticking out away from the palm (cross product or distance from index base)
      const palmCenter = landmarks[9];
      const thumbDistToPalm = magnitude(getVector(landmarks[4], palmCenter));
      const indexBaseDistToPalm = magnitude(getVector(landmarks[5], palmCenter));

      // Thumb is open if it's relatively straight AND extended away from the center of the palm
      const th = (thumbAngle < 40 && thumbDistToPalm > indexBaseDistToPalm * 1.5);

      // Other fingers use the reliable 3D structural straightness check
      const ind = isFingerExtended3D(landmarks[5], landmarks[6], landmarks[7], landmarks[8]);
      const mid = isFingerExtended3D(landmarks[9], landmarks[10], landmarks[11], landmarks[12]);
      const rin = isFingerExtended3D(landmarks[13], landmarks[14], landmarks[15], landmarks[16]);
      const pin = isFingerExtended3D(landmarks[17], landmarks[18], landmarks[19], landmarks[20]);

      // 5-character string representing exactly which fingers are open (1) or closed (0)
      const state = "" + (th ? 1 : 0) + (ind ? 1 : 0) + (mid ? 1 : 0) + (rin ? 1 : 0) + (pin ? 1 : 0);

      wCtx.fillStyle = 'white';
      wCtx.font = '14px monospace';
      wCtx.fillText("Pose: " + state, 10, 20);

      // Unified check dictionary with the Thumb fully restored
      const GESTURES = {
        '11001': 'SPIDERMAN', // Thumb, Index, Pinky

        '01001': 1, // The Horns (Index & Pinky)
        '01100': 2, // The Two-Finger Blade / Peace (Index & Middle)
        '01110': 3, // The Trident (3 fingers)
        '01000': 4, // The Hook (Index only)
        '11000': 5, // The Gun (Thumb + Index)
        '10001': 6, // The Shaka (Thumb + Pinky)
        '00001': 7, // The Teacup (Pinky only)
        '00111': 8, // The Reversed Trident (Middle, Ring, Pinky)
        '11111': 9, // The Wall (Open Palm)
        '01111': 10 // Four Fingers
      };

      const match = GESTURES[state];

      if (match === 'SPIDERMAN') {
        wCtx.fillStyle = '#f00';
        wCtx.fillText("Spider-Man", 10, 40);
        return 'SPIDERMAN';
      } else if (match) {
        wCtx.fillStyle = '#0f0';
        wCtx.fillText("Track " + match, 10, 40);
        return match;
      }

      return null;
    }


    // ============================================
    // STEP 7 — Window System
    // ============================================

    // 18 window positions (from TRD.md) — % coordinates relative to viewport
    const WINDOWS = [
      { id: 'w1', x: 40.77, y: 30.80, w: 2.0, h: 4.0, color: '#EF4444', band: 'bass' },
      { id: 'w2', x: 59.77, y: 31.87, w: 2.0, h: 4.0, color: '#3B82F6', band: 'high' },

      { id: 'w5', x: 40.77, y: 41.27, w: 2.0, h: 4.0, color: '#F59E0B', band: 'mid' },

      { id: 'w20', x: 34.13, y: 59.36, w: 2.0, h: 4.0, color: '#F59E0B', band: 'mid' },
      { id: 'w21', x: 40.77, y: 59.89, w: 2.0, h: 4.0, color: '#EF4444', band: 'bass' },
      { id: 'w22', x: 45.51, y: 59.44, w: 2.0, h: 4.0, color: '#3B82F6', band: 'high' },

      { id: 'w25', x: 59.77, y: 59.98, w: 2.0, h: 4.0, color: '#F59E0B', band: 'mid' },
      { id: 'w26', x: 66.41, y: 59.98, w: 2.0, h: 4.0, color: '#EF4444', band: 'bass' },
      { id: 'w27', x: 72.46, y: 59.98, w: 2.0, h: 4.0, color: '#3B82F6', band: 'high' },
      { id: 'w28', x: 78.52, y: 59.89, w: 2.0, h: 4.0, color: '#10B981', band: 'mid' },

      { id: 'w31', x: 20.95, y: 74.93, w: 2.0, h: 4.0, color: '#EF4444', band: 'bass' },
      { id: 'w32', x: 27.10, y: 73.86, w: 2.0, h: 4.0, color: '#3B82F6', band: 'high' },
      { id: 'w33', x: 34.13, y: 73.86, w: 2.0, h: 4.0, color: '#10B981', band: 'mid' },
      { id: 'w34', x: 40.77, y: 76.37, w: 2.0, h: 4.0, color: '#8B5CF6', band: 'high' },
      { id: 'w35', x: 59.77, y: 76.37, w: 2.0, h: 4.0, color: '#F59E0B', band: 'mid' },
      { id: 'w36', x: 66.41, y: 73.77, w: 2.0, h: 4.0, color: '#EF4444', band: 'bass' },
      { id: 'w37', x: 73.05, y: 73.77, w: 2.0, h: 4.0, color: '#3B82F6', band: 'high' },
      { id: 'w38', x: 78.12, y: 74.93, w: 2.0, h: 4.0, color: '#10B981', band: 'mid' },
      { id: 'w39', x: 86.13, y: 74.84, w: 2.0, h: 4.0, color: '#8B5CF6', band: 'high' },
    ];

    // Create window DOM elements
    const windowContainer = document.getElementById('windows-container');
    WINDOWS.forEach(w => {
      const el = document.createElement('div');
      el.id = w.id;
      el.className = 'castle-window';
      el.style.left = `${w.x}%`;
      el.style.top = `${w.y}%`;
      el.style.width = `${w.w}%`;
      el.style.height = `${w.h}%`;
      el.style.setProperty('--window-color', w.color);
      el.style.setProperty('--window-opacity', '0');
      el.style.setProperty('--pulse-speed', '0.8s');
      windowContainer.appendChild(el);
    });

    // Update windows based on frequency bands — called every animation frame
    function updateWindows(bass, mid, high) {
      WINDOWS.forEach(w => {
        let intensity;
        if (w.band === 'bass') intensity = bass / 255;
        if (w.band === 'mid') intensity = mid / 255;
        if (w.band === 'high') intensity = high / 255;

        // Scale by master volume
        intensity *= masterVolume;

        const el = document.getElementById(w.id);
        if (!el) return;

        // Full range 0.0 to 1.0 for dramatic fluctuation
        const opacity = Math.min(intensity * 1.5, 1.0);
        const scale = 1.0 + intensity * 0.3; // 1.0 - 1.3x
        const brightness = 1.0 + intensity * 3.0; // 1.0 - 4.0
        const blur = 2 + intensity * 8; // 2px - 10px

        el.style.opacity = String(opacity);
        el.style.transform = `scale(${scale})`;
        el.style.filter = `blur(${blur}px) brightness(${brightness})`;
        el.classList.add('lit');
      });
    }

    // Dim all windows (idle state)
    function dimAllWindows() {
      WINDOWS.forEach(w => {
        const el = document.getElementById(w.id);
        if (!el) return;
        el.style.opacity = '0';
        el.style.transform = 'scale(1)';
        el.style.filter = 'blur(5px) brightness(0.5)';
        el.classList.remove('lit');
      });
    }

    // Beat drop effect
    let beatDropActive = false;
    function onBeatDrop() {
      if (beatDropActive) return;
      beatDropActive = true;

      // All windows flare white-hot
      document.querySelectorAll('.castle-window.lit').forEach(w => {
        w.style.filter = 'blur(10px) brightness(3.0)';
        w.style.transform = 'scale(1.5)';
        w.style.boxShadow = '0 0 40px 20px rgba(255,255,255,0.5)';
      });
      setTimeout(() => {
        beatDropActive = false;
      }, 120);

      // Moon pulse
      moonOverlay.style.filter = 'brightness(3) blur(3px)';
      moonOverlay.style.transform = 'scale(1.2)';
      setTimeout(() => {
        moonOverlay.style.filter = '';
        moonOverlay.style.transform = '';
      }, 200);
    }

    // ============================================
    // Independent Visual Update Loop (60fps)
    // Reads analyser data independently of MediaPipe frame rate
    // ============================================
    let visualLoopRunning = false;

    function startVisualLoop() {
      if (visualLoopRunning) return;
      visualLoopRunning = true;
      requestAnimationFrame(visualLoop);
    }

    function stopVisualLoop() {
      visualLoopRunning = false;
    }

    function visualLoop() {
      if (!visualLoopRunning) return;

      if (isPlaying || isSpiderManMode) {
        const bands = getFrequencyBands();
        updateWindows(bands.bass, bands.mid, bands.high);
        checkBeatDrop(bands.bass);

        // Moon subtle pulse on bass
        if (!beatDropActive) {
          if (bands.bass > 100) {
            const moonIntensity = 1 + (bands.bass - 100) / 155;
            moonOverlay.style.filter = `brightness(${moonIntensity}) blur(${moonIntensity * 0.5}px)`;
          } else {
            moonOverlay.style.filter = '';
          }
        }
      }

      requestAnimationFrame(visualLoop);
    }


    // ============================================
    // STEP 8 — Volume Arc
    // ============================================

    function drawVolumeArc(wristX, wristY, volumePercent) {
      const radius = 55;
      const startAngle = -Math.PI * 0.75;
      const endAngle = startAngle + (Math.PI * 1.5 * volumePercent);

      // Background track
      ctx.beginPath();
      ctx.arc(wristX, wristY, radius, -Math.PI * 0.75, Math.PI * 0.75);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Filled arc
      ctx.beginPath();
      ctx.arc(wristX, wristY, radius, startAngle, endAngle);
      ctx.strokeStyle = volumePercent > 0.7 ? '#EF4444' : '#A855F7';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Volume number
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${Math.round(volumePercent * 100)}`, wristX, wristY + 5);
    }


    // ============================================
    // STEP 9 — Spider-Man Mode
    // ============================================

    function drawSpiderProgress(x, y, progress) {
      const maxRadius = 80;
      ctx.beginPath();
      ctx.arc(x, y, maxRadius * progress, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(220, 38, 38, ${0.3 + progress * 0.7})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Web shot animation
    const webLines = [];

    function fireWebShot(originX, originY) {
      const angles = Array.from({ length: 8 }, (_, i) => (i / 8) * Math.PI * 2);
      angles.forEach(angle => {
        webLines.push({
          ox: originX,
          oy: originY,
          angle: angle,
          progress: 0,
          maxLen: Math.max(window.innerWidth, window.innerHeight) * 0.8,
          startTime: Date.now(),
          duration: 600,
        });
      });
    }

    function drawWebLines() {
      const now = Date.now();
      for (let i = webLines.length - 1; i >= 0; i--) {
        const line = webLines[i];
        const elapsed = now - line.startTime;
        line.progress = Math.min(elapsed / line.duration, 1);

        const len = line.progress * line.maxLen;
        const endX = line.ox + Math.cos(line.angle) * len;
        const endY = line.oy + Math.sin(line.angle) * len;

        const alpha = 1 - line.progress * 0.7;

        ctx.beginPath();
        ctx.moveTo(line.ox, line.oy);
        ctx.lineTo(endX, endY);
        ctx.strokeStyle = `rgba(220, 38, 38, ${alpha})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        if (line.progress >= 1) {
          webLines.splice(i, 1);
        }
      }
    }

    function enterSpiderManMode(handX, handY) {
      if (isSpiderManMode) return;
      isSpiderManMode = true;

      // Clear any release timer
      if (spiderManReleaseTimer) {
        clearTimeout(spiderManReleaseTimer);
        spiderManReleaseTimer = null;
      }

      // City overlay
      cityOverlay.classList.add('active');

      // Fire web shot from hand position
      fireWebShot(handX * window.innerWidth, handY * window.innerHeight);

      // Crossfade to Spider-Man track
      Object.values(players).forEach(p => {
        if (p.state === 'started') {
          p.volume.rampTo(-60, 2);
          setTimeout(() => { try { p.stop(); } catch (e) { } }, 2100);
        }
      });

      spiderPlayer.volume.value = -60;
      try { spiderPlayer.start(); } catch (e) { }
      spiderPlayer.volume.rampTo(0, 2);

      trackNameEl.textContent = 'Spider-Man';
      trackNameEl.classList.add('visible');

      // Start visual loop for Spider-Man mode
      startVisualLoop();
    }

    function exitSpiderManMode() {
      if (!isSpiderManMode) return;

      spiderManReleaseTimer = setTimeout(() => {
        isSpiderManMode = false;

        // Fade city overlay
        cityOverlay.classList.remove('active');

        // Stop spider track
        if (spiderPlayer.state === 'started') {
          spiderPlayer.volume.rampTo(-60, 3);
          setTimeout(() => { try { spiderPlayer.stop(); } catch (e) { } }, 3100);
        }

        // Re-match a phonk track
        currentTrackId = null;
        isPlaying = false;
        spiderManCounter = 0;
        spiderManReleaseTimer = null;
      }, 3000);
    }


    // ============================================
    // STEP 4 & 10 — MediaPipe Hands + No-Hand State
    // ============================================

    let handPresent = false;
    let handLostTime = 0;
    const HAND_LOST_DEBOUNCE = 500; // ms
    let systemState = 'IDLE'; // IDLE, READING, PLAYING, ROTATING, SPIDER_MAN
    let appStarted = false;

    function showError(msg) {
      errorMessage.textContent = msg;
      errorScreen.classList.add('active');
    }

    // Start screen click handler
    startScreen.addEventListener('click', async () => {
      startScreen.classList.add('hidden');

      try {
        await initAudio();
      } catch (e) {
        console.error('Audio init failed:', e);
      }

      try {
        await initMediaPipe();
      } catch (e) {
        console.error('MediaPipe init failed:', e);
        showError('hand tracking failed to load — check connection');
      }

      appStarted = true;
    });

    async function initMediaPipe() {
      // Check for camera
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        webcamPreview.srcObject = stream;
        inputVideo.srcObject = stream;
      } catch (e) {
        showError('camera access required — refresh and allow');
        throw e;
      }

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.6,
      });

      hands.onResults(onHandResults);

      const camera = new Camera(inputVideo, {
        onFrame: async () => {
          try {
            await hands.send({ image: inputVideo });
          } catch (e) { }
        },
        width: 640,
        height: 480,
      });

      await camera.start();
      console.log('MediaPipe Hands initialized.');
    }


    // ============================================
    // STEP 11 — Main Loop (onResults callback)
    // ============================================

    function onHandResults(results) {
      if (!appStarted || !audioReady) return;

      const now = Date.now();

      // Clear canvas
      ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      // Draw any active web lines
      drawWebLines();

      // --- Priority 1: Check if hand is present ---
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        if (handPresent) {
          if (handLostTime === 0) handLostTime = now;

          // Debounce: only trigger idle after 500ms
          if (now - handLostTime > HAND_LOST_DEBOUNCE) {
            handPresent = false;
            systemState = 'IDLE';
            stopAllMusic();
            dimAllWindows();
            activePose = null;
            poseHoldFrames = 0;
            prevLandmarks = null;
            spiderManCounter = 0;
            wCtx.clearRect(0, 0, webcamCanvas.width, webcamCanvas.height);

            if (isSpiderManMode) {
              isSpiderManMode = false;
              cityOverlay.classList.remove('active');
            }
          }
        }
        return;
      }

      // Hand is present
      handPresent = true;
      handLostTime = 0;
      const landmarks = results.multiHandLandmarks[0];

      // --- Priority 2: Spider-Man Pose (Now unified via classifyPose check) ---
      const poseMatch = classifyPose(landmarks);

      if (poseMatch === 'SPIDERMAN') {
        spiderManCounter++;

        // Draw progress ring
        const handX = landmarks[9].x;
        const handY = landmarks[9].y;
        const progress = Math.min(spiderManCounter / SPIDER_MAN_THRESHOLD, 1);
        drawSpiderProgress(
          handX * overlayCanvas.width,
          handY * overlayCanvas.height,
          progress
        );

        if (spiderManCounter >= SPIDER_MAN_THRESHOLD) {
          if (!isSpiderManMode) {
            enterSpiderManMode(handX, handY);
            systemState = 'SPIDER_MAN';
          }
          // Clear release timer while holding
          if (spiderManReleaseTimer) {
            clearTimeout(spiderManReleaseTimer);
            spiderManReleaseTimer = null;
          }
        }

        prevLandmarks = landmarks;

        // Still update windows with frequency data while in spider mode
        if (isSpiderManMode) {
          const bands = getFrequencyBands();
          updateWindows(bands.bass, bands.mid, bands.high);
          checkBeatDrop(bands.bass);
        }
        return;
      } else {
        // Pose dropped
        if (spiderManCounter > 0) spiderManCounter = 0;
        if (isSpiderManMode) {
          exitSpiderManMode();
        }
      }

      // --- Priority 3: Volume Rotation ---
      const rotationDelta = detectWristRotation(landmarks);
      if (rotationDelta !== 0) {
        // Adjust volume
        masterVolume = clamp(masterVolume + rotationDelta * 0.5, 0, 1);

        // Update Tone.js master volume
        Tone.Destination.volume.value = volumeToDb(masterVolume);

        showVolumeArc = true;
        rotationInactiveFrames = 0;

        // Clear fade timer
        if (volumeArcFadeTimer) clearTimeout(volumeArcFadeTimer);
        volumeArcFadeTimer = setTimeout(() => {
          showVolumeArc = false;
        }, 1500);

        systemState = 'ROTATING';
      } else {
        rotationInactiveFrames++;
        if (rotationInactiveFrames > 10 && systemState === 'ROTATING') {
          systemState = 'PLAYING';
        }
      }

      // Draw volume arc if active
      if (showVolumeArc) {
        const wrist = landmarks[0];
        drawVolumeArc(
          wrist.x * overlayCanvas.width,
          wrist.y * overlayCanvas.height,
          masterVolume
        );
      }

      // Draw hand skeleton
      drawHandSkeleton(landmarks);

      // --- Priority 4: Specific Gestures → Track Matching ---

      // If we made it here, poseMatch is either a track number (1-10) or null.
      // (It is NOT 'SPIDERMAN' because that triggers a return inside Priority 2 above)
      const poseId = (typeof poseMatch === 'number') ? poseMatch : null;

      if (poseId !== null) {
        if (poseId === activePose) {
          poseHoldFrames++;
          if (poseHoldFrames === POSE_HOLD_THRESHOLD) {
            // Trigger track change
            if (!isPlaying) {
              startTrack(poseId);
              startVisualLoop();
              systemState = 'PLAYING';
            } else if (poseId !== currentTrackId) {
              crossfadeTo(poseId);
            }
          }
        } else {
          activePose = poseId;
          poseHoldFrames = 1;
        }
      } else {
        poseHoldFrames = 0;
        activePose = null;
      }

      // Visual updates are now handled by the independent visualLoop at 60fps

      // Store landmarks for next frame
      prevLandmarks = landmarks;
    }
  </script>
